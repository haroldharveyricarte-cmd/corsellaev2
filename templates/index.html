<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CorStellae</title>

  <!-- Favicon (Browser Tab Logo) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="dashboard-page">

  <!-- Mobile Overlay -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Image Lightbox Modal -->
  <div id="imageModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span id="closeModalBtn" class="modal-close">&times;</span>
      <img id="modalImage" src="" alt="Enlarged view" />
    </div>
  </div>

  <!-- Popup Toast Container -->
<div id="toastNotification" style="position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 8px; border-left: 4px solid #6366f1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); font-size: 13px; font-weight: 500; display: none; z-index: 9999; transition: opacity 0.3s ease;">
  💬 Your comment was submitted and is pending admin approval!
</div>

<!-- Custom Confirmation Modal Overlay -->
<div id="customConfirmModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; z-index: 10000;">
  <div style="background: #1f2937; color: #f3f4f6; padding: 24px; border-radius: 12px; width: 380px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #374151; font-family: inherit;">
    <h3 id="confirmModalTitle" style="margin-top: 0; font-size: 16px; font-weight: 600; color: #fff;">Are you sure?</h3>
    <p id="confirmModalMessage" style="font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5;"></p>
    
    <!-- Optional input for prompts (like editing content) -->
    <textarea id="confirmModalInput" style="width: 100%; height: 80px; background: #111827; border: 1px solid #374151; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; display: none; margin-bottom: 20px; resize: vertical;"></textarea>
    
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button id="confirmModalCancelBtn" style="background: #374151; color: #d1d5db; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Cancel</button>
      <button id="confirmModalOkBtn" style="background: #f97316; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Confirm</button>
    </div>
  </div>
</div>

  <!-- Scrollable Facebook-Style Comments Modal -->
  <div id="commentsModal" class="modal-overlay" style="display: none;">
    <div class="comments-modal-box">
      <div class="comments-modal-header">
        <h3>Comments</h3>
        <span id="closeCommentsModalBtn" class="modal-close-icon">&times;</span>
      </div>
      <div id="modalCommentsList" class="comments-modal-body"></div>
      <div class="comments-modal-footer">
        <input type="text" id="modalCommentInput" placeholder="Write a comment..." />
        <button id="modalCommentSubmitBtn" class="btn-sm btn-primary">Comment</button>
      </div>
    </div>
  </div>

  <!-- Reactions List Modal -->
  <div id="reactionUsersModal" class="modal-overlay" style="display: none;">
    <div class="reactions-modal-box">
      <div class="comments-modal-header">
        <h3>Reactions</h3>
        <span id="closeReactionUsersModalBtn" class="modal-close-icon">&times;</span>
      </div>
      <div id="reactionUsersList" class="reactions-modal-body"></div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="logo">✨</span>
        <span class="brand-text">CorStellae</span>
      </div>
      <button id="closeSidebar" class="close-btn">&times;</button>
    </div>

    <nav class="sidebar-menu">
      <button class="nav-item active" data-view="feedView">
        <span class="icon">🏠</span> <span>Feed</span>
      </button>
      <button class="nav-item" data-view="profileView">
        <span class="icon">👤</span> <span>Profile</span>
      </button>
      <button id="adminTabBtn" class="nav-item admin-only" data-view="adminView" style="display: none;">
        <span class="icon">🛡️</span> <span>Admin Panel</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-mini-profile">
        <img id="sideAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="Avatar" />
        <div class="user-info">
          <span id="sideName">Loading...</span>
          <span id="sideRoleBadge" class="badge">User</span>
        </div>
      </div>
      <button id="logoutBtn" class="btn-logout">Log Out</button>
    </div>
  </aside>

  <!-- Main Body Wrapper -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button id="toggleSidebar" class="menu-btn">☰</button>
        <h2 id="pageTitle">Dashboard Feed</h2>
      </div>

      <!-- Mobile-Friendly Search Bar -->
      <div class="search-bar-wrapper">
        <input type="text" id="searchInput" placeholder="Search posts or users..." />
        <button id="clearSearchBtn" style="display: none;">&times;</button>
      </div>

      <!-- Notifications Bell Icon -->
      <div class="topbar-right">
        <div class="notification-wrapper">
          <button id="notifBellBtn" class="notif-bell-btn">
            🔔 <span id="notifBadge" class="notif-badge" style="display: none;">0</span>
          </button>
          <div id="notifDropdown" class="notif-dropdown" style="display: none;">
            <div class="notif-header">
              <h4>Notifications</h4>
              <button id="markReadBtn" class="btn-sm btn-secondary">Mark read</button>
            </div>
            <div id="notifList" class="notif-list"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-container">
      
      <!-- FEED VIEW -->
      <section id="feedView" class="view-section active">
        <div class="create-post-card">
          <h3>Share Your Story</h3>
          <form id="postForm">
            <textarea id="postContent" placeholder="Write your story..." rows="3" required></textarea>
            
            <!-- Post Image Preview Container -->
            <div id="postPreviewContainer" class="post-preview-wrapper" style="display: none;">
              <img id="postImagePreview" src="" alt="Preview" />
              <button type="button" id="removePostImageBtn" class="btn-sm btn-logout">Remove Image</button>
            </div>

            <div class="post-actions">
              <div class="file-upload-wrapper">
                <label for="imageInput" class="file-label">📷 Attach Photo</label>
                <input type="file" id="imageInput" accept="image/*" />
              </div>
              <label class="anon-toggle">
                <input type="checkbox" id="anonCheckbox" />
                <span>Post Anonymously</span>
              </label>
            </div>

            <button type="submit" class="btn-primary">Submit for Review</button>
          </form>
          <p id="uploadStatus" class="status-msg"></p>
        </div>

        <div class="feed-section">
          <h3>Community Stories</h3>
          <div id="feedGrid" class="feed-grid"></div>
        </div>
      </section>

      <!-- PROFILE VIEW -->
      <section id="profileView" class="view-section" style="display: none;">
        <div class="profile-card">
          <h3>Edit Profile</h3>
          <form id="profileForm">
            <div class="avatar-edit-container">
              <div class="avatar-wrapper">
                <img id="profileAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar Preview" />
              </div>
              <div class="avatar-btn-group">
                <label for="avatarInput" class="file-label">📷 Change Photo</label>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;" />
                <button type="button" id="removeAvatarBtn" class="btn-secondary btn-danger-text">🗑️ Remove Photo</button>
              </div>
            </div>

            <div class="input-group">
              <label for="editNickname">Display Name</label>
              <input type="text" id="editNickname" required />
            </div>

            <div class="input-group">
              <label for="editBio">Bio</label>
              <textarea id="editBio" rows="3" placeholder="Tell the community about yourself..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Save Changes</button>
          </form>
          <p id="profileStatus" class="status-msg"></p>
        </div>
      </section>

     <!-- ADMIN PANEL VIEW -->
      <section id="adminView" class="view-section" style="display: none;">
        <div class="admin-grid">
          <div class="admin-card">
            <!-- Modern Pill Toggle Tabs -->
            <div style="display: flex; background: #111827; padding: 4px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #374151; gap: 4px;">
              <button onclick="switchAdminTab('posts')" id="tab-posts-btn" style="flex: 1; padding: 8px 12px; font-size: 13px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; background: #4f46e5; color: white; transition: all 0.2s;">Pending Posts</button>
              <button onclick="switchAdminTab('comments')" id="tab-comments-btn" style="flex: 1; padding: 8px 12px; font-size: 13px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: #9ca3af; transition: all 0.2s;">Pending Comments</button>
            </div>

            <!-- Pending Posts Section -->
            <div id="admin-posts-container" class="admin-tab-content">
              <div id="pendingPostsList" class="admin-list space-y-3"></div>
            </div>

            <!-- Pending Comments Section -->
            <div id="admin-comments-container" class="admin-tab-content" style="display: none;">
              <div id="pending-comments-list" class="admin-list space-y-3"></div>
            </div>
          </div>

          <div class="admin-card">
            <h3>User Management</h3>
            <div id="usersList" class="admin-list"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
